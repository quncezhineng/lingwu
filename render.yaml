services:
  - type: web
    name: lingwu-api
    runtime: node
    # starter (512 MB) gets OOM-killed before the server binds a port, because
    # the default PGlite store loads an embedded Postgres WASM build.
    plan: standard
    # No corepack: Render preinstalls pnpm at /usr/bin and /usr is read-only, so
    # `corepack enable` dies with EROFS. Render's pnpm honors packageManager.
    buildCommand: pnpm install --frozen-lockfile && pnpm build:server
    startCommand: pnpm start
    healthCheckPath: /api/health
    # 持久盘：配置 DATABASE_URL 后不再承载记录库；配好 SUPABASE_URL + SUPABASE_SECRET_KEY
    # 后用户上传文件（files/）与电脑截图（desktop-screens/）也改存 Supabase Storage，
    # 只剩旧版 PGlite 数据目录（postgres/，切库后不再使用）与未迁移的历史文件。
    # 1 GB 会在积累使用后写满：磁盘满会让 PGlite 写入中途失败、控制文件损坏，此后每次
    # 启动都抛不透明的 RuntimeError: Aborted()，且满到极限时 mkdir 直接 ENOSPC（2026-11-26
    # 线上崩溃）。代码已加「启动清理旧归档 + 磁盘满时删除本次归档」自愈，此处保留 5 GB 余量。
    # 存量文件搬运：DATA_DIR=/var/data/lingwu pnpm files:migrate（在本地或一次性 shell 执行）。
    disk:
      name: lingwu-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      # HOST must be 0.0.0.0 on Render, and LingWu only allows that in live mode.
      - key: HOST
        value: 0.0.0.0
      - key: WORKSPACE_MODE
        value: live
      - key: AGENT_BACKEND
        value: model
      - key: MODEL
        value: deepseek/deepseek-flash
      - key: DATA_DIR
        value: /var/data/lingwu
      # 记录库（records/events）存放位置。填了 Supabase 的 Postgres 连接串后，
      # 记录库改到托管数据库，不再用容器内嵌的 PGlite——这才是「更新就丢数据」的根治：
      # PGlite 把数据库放在持久盘里，盘写满会让数据目录损坏、自愈时甚至删除整库。
      # 托管 Postgres 与容器/磁盘解耦，部署、扩容都不会动到数据。
      # 连接串在 Render 控制台 Environment 手动填（sync: false 不从蓝图同步），形如：
      #   postgresql://postgres.<ref>:<密码>@aws-0-<region>.pooler.supabase.com:6543/postgres
      # 用 Supabase 控制台「Connect」里的 Connection string（Session/Transaction pooler 均可）。
      # 留空则退回 PGlite（本地开发默认如此，无需配置）。
      - key: DATABASE_URL
        sync: false
      - key: TASK_WORKER_ENABLED
        value: "true"
      # Per-minute /api/* request cap per client IP. The web app polls several
      # screens at once; raise the local default (120) to avoid self-inflicted
      # 429s. Value mirrors .env.
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "1200"
      # Daily market briefing scheduler (O2): the embedded task worker creates one
      # durable `market_briefing` task per owner with a watchlist per UTC date
      # (catch-up after downtime, at most 3 attempts/day). Must stay true for
      # automatic daily briefings; false keeps only manual generation.
      - key: BRIEFING_SCHEDULE_ENABLED
        value: "true"
      # UTC hour of the daily run (default 0). 0 = UTC 00:00 = Beijing 08:00,
      # right before the A-share open and after the US close (~20:00 ET).
      - key: BRIEFING_SCHEDULE_UTC_HOUR
        value: "0"
      # Second-level event triage (PRD R2 / Open Question).
      # rules  = rule scoring only (recommended for first deploy; behaviour unchanged)
      # shadow = rules still decide; the model only records a comparison verdict,
      #          run it for a few days and compare push acceptance via
      #          GET /api/investor/feed/stats before switching to model
      # model  = the model sets the 0..100 score; rule result is kept in `shadow`
      # Failure, timeout (8s) or an unconfigured model always falls back to rules
      # and is marked judgedBy=rules_fallback, so an event is never dropped.
      - key: EVENT_JUDGE
        value: rules
      # Blank (below) = the model the user picked in the app. To pin a dedicated
      # lightweight judge model instead, uncomment and set it, e.g.:
      # - key: EVENT_JUDGE_MODEL
      #   value: deepseek/deepseek-flash
      # AKShare self-check cache surfaced by GET /api/health as
      # market_data.akshare.status. Keep long enough to avoid spawning python3
      # on every health poll; python3 + akshare must be preinstalled for live
      # A-share data, otherwise A-shares fall back to Yahoo (15-min delay).
      - key: MARKET_DATA_HEALTH_TTL_MS
        value: "300000"
      # P1 financial report parsing: POST /api/financials/parse extracts PDF text
      # via pdftotext (poppler-utils). The binary name is looked up on PATH; install
      # poppler-utils in this environment for PDF uploads, otherwise they return 422
      # while pasted text keeps working. Probe state is surfaced by /api/health pdf.status.
      - key: PDFTOTEXT_BIN
        value: pdftotext
      - key: PDF_HEALTH_TTL_MS
        value: "300000"
      - key: PDF_HEALTH_TIMEOUT_MS
        value: "3000"
      # P1 risk metrics: annual risk-free rate used for the Sharpe ratio (default 2%).
      - key: RISK_FREE_RATE
        value: "0.02"
      # Daily-history quotes (charts / indicator inputs): 10s per-symbol deadline,
      # 30min cache TTL. Tune only when provider latency or freshness matters.
      - key: MARKET_DATA_HISTORY_TIMEOUT_MS
        value: "10000"
      - key: MARKET_DATA_HISTORY_CACHE_TTL_MS
        value: "1800000"
      - key: PUBLIC_API_URL
        fromService:
          name: lingwu-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # 分享链接等面向收件人的地址使用前端域名（lingwu-web），而不是 API 域名。
      # 固定写成自定义前端域名，而不是 fromService 派生 RENDER_EXTERNAL_URL：
      # 后者永远是默认的 lingwu-web.onrender.com，绑定自定义域名后不会变，
      # 每次蓝图同步都会把这里重置回默认域名，导致 app.lingwu.xyz 被 403 拦死
      # （页面能加载、接口全失败，看起来像「打不开」）。改域名只需改这一处。
      - key: PUBLIC_WEB_URL
        value: https://app.lingwu.xyz
      # 允许跨域的前端来源白名单（前端自定义域名 + 默认 onrender 域名，两者都保留）。
      # app.ts 还会自动放行 PUBLIC_API_URL 与 PUBLIC_WEB_URL 的 origin，
      # 这里显式列出是为了自定义域名与默认域名都能正常访问、且不再被蓝图重置。
      - key: ALLOWED_ORIGINS
        value: https://app.lingwu.xyz,https://lingwu-web.onrender.com
      # User accounts: with these three set, every user signs up and signs in with
      # their own email and gets a private workspace. Leave them unset to fall back
      # to the single shared LINGWU_ACCESS_KEY below.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Email verification-code sign-in uses Supabase Auth's email OTP (enable
      # "Email OTP" in Supabase Auth settings; no extra provider key needed).
      # Signed-in sessions expire after this many milliseconds (default 7 days).
      - key: SESSION_TTL_MS
        value: "604800000"
      # 会话签名密钥：手动固定，与 TOKEN_ENCRYPTION_KEY 同理（sync: false 表示不从蓝图
      # 同步，需在 Render 控制台 Environment 手动填入）。配置后登录态不再依赖容器磁盘，
      # 实例重建、换盘或迁移都不会把已登录用户踢下线；不配则退回持久盘上的
      # /var/data/lingwu/session-signing-key，盘一重建所有人都要重新登录。
      # 生成：openssl rand -base64 32。若不想让现有用户掉线，就直接填持久盘上的现值
      # （Render Shell 里 `cat /var/data/lingwu/session-signing-key`）。
      - key: SESSION_SIGNING_KEY
        sync: false
      # Only used when the Supabase variables above are unset (one owner per deploy).
      - key: LINGWU_ACCESS_KEY
        generateValue: true
      # 手动固定的密钥：必须与本地 .env 的 TOKEN_ENCRYPTION_KEY 保持一致。
      # sync: false 表示不从蓝图同步，需在 Render 控制台 Environment 中手动填入；
      # 切勿改回 generateValue，否则自动生成的密钥在环境重建后会变化，
      # 导致历史加密的用户数据无法解密。
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      # 公开的 OpenAI 兼容端点，非密钥，直接固定无需在控制台填入。
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      # Live Google workspace (Gmail/Calendar): enable the OAuth consent screen and
      # set the redirect URI to PUBLIC_API_URL + /api/google/callback (PUBLIC_API_URL
      # is already the live Render URL above).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: WEB_SEARCH_ENABLED
        value: "true"
      # 公共网页搜索的 Parallel API Key（https://platform.parallel.ai）。
      # 填了之后：部署内所有用户共享该 Key 的更高额度，避免 Keyless 免费档限流。
      # 敏感值不在仓库里写死：sync: false 表示需要到 Render 控制台
      # Environment 中手动填入（与 DEEPSEEK_API_KEY 一致）。
      - key: WEB_SEARCH_API_KEY
        sync: false
      - key: CPK_INTELLIGENCE_API_KEY
        sync: false
      # Use the CLI-issued identity for the same Intelligence project as the key.
      - key: CPK_TELEMETRY_ID
        sync: false
      # Opt out of CopilotKit SDK telemetry (same as .env).
      - key: COPILOTKIT_TELEMETRY_DISABLED
        value: "true"
      # Hindsight 记忆引擎（多 Agent 长时记忆）。Base URL 留空时引擎不启用，
      # 走本地关键词召回降级。Render 采用云端模式：
      # https://api.hindsight.vectorize.io（需 HINDSIGHT_API_KEY，控制台手动填入）。
      # 与 .env / .env.example 同步：HINDSIGHT_LLM_* 与 HF_ENDPOINT 仅供自托管容器
      # （infra/hindsight.yaml）读取，云端模式下 LingWu API 不读取（见 config.ts），
      # 因此不再在 Render 上配置这 5 个变量。
      - key: HINDSIGHT_BASE_URL
        sync: false
      - key: HINDSIGHT_API_KEY
        sync: false
      # Delete these two entries, and the lingwu-browser service below, to
      # deploy without browsing. The API boots either way.
      - key: BROWSER_WORKER_URL
        value: http://lingwu-browser:8790
      - key: WORKER_TOKEN
        fromService:
          name: lingwu-browser
          type: pserv
          envVarKey: WORKER_TOKEN
      # Per-user Linux computer sandbox (optional). Choose E2B Desktop so every
      # user gets their own container; a unique COMPUTER_DEPLOYMENT_ID is required.
      # COMPUTER_ENABLED is on so the cloud (Render) sandbox works out of the box;
      # it is backed by E2B Desktop, not the local Docker image.
      - key: COMPUTER_ENABLED
        value: "true"
      - key: COMPUTER_PROVIDER
        value: e2b-desktop
      - key: E2B_API_KEY
        sync: false
      - key: COMPUTER_DEPLOYMENT_ID
        sync: false

  # Private Chromium for page reads, screenshots, and Take control.
  # Remove this service to skip it. The image listens on 8790, not $PORT.
  - type: pserv
    name: lingwu-browser
    runtime: docker
    plan: standard
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: ./apps/worker
    disk:
      name: lingwu-browser-data
      mountPath: /data
      # Chromium 持久化配置（每份约数十至上百 MB，缓存已用 --disk-cache-size=1 关闭）
      # + 已下载 PDF（每会话上限 20 份、每份 ≤10 MiB）会随使用累积。2 GB 在长时间运行
      # 后被写满，worker 启动即崩（ENOSPC，2026-11-27 线上崩溃）。代码已加 LRU 淘汰与
      # 磁盘满自愈（启动时先淘汰到远低于上限的配置数、再兜底清空），此处按 20 份配置
      # + PDF 修剪到每会话 4 份的稳态占用，保留 5 GB 余量。
      sizeGB: 5
    envVars:
      - key: WORKER_TOKEN
        generateValue: true
      - key: WORKER_HOST
        value: 0.0.0.0
      - key: WORKER_DATA_DIR
        value: /data
      # Raise these when many signed-in users need the browser at once; each user
      # gets an isolated Chromium profile.
      - key: WORKER_MAX_SESSIONS
        value: "3"
      - key: WORKER_MAX_PROFILES
        value: "20"

  - type: web
    name: lingwu-web
    runtime: static
    # --clear avoids a cached Metro transform keeping a stale EXPO_PUBLIC_API_URL,
    # which Expo inlines into the bundle at build time.
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm --dir apps/mobile exec expo export --platform web --output-dir dist/web --clear
    staticPublishPath: apps/mobile/dist/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        fromService:
          name: lingwu-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
